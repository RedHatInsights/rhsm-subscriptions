$schema: http://json-schema.org/draft-07/schema#
title: UsageEvent
description: Event that represents usage data for a service instance. Contains canonical facts, applicable measurements and timestamp.
properties:
  org_id:
    description: Organization identifier associated with this event.
    type: string
    examples:
      - '123456789'
  service_type:
    description: >
      Identifier for the type of service being measured. (E.g. RHEL System, OpenShift Cluster). Used to match the event to the correct SWATCH product configuration.
      This should equal the 'serviceType' value of the matching product in swatch-product-configuration project subscription_configs.
    type: string
    examples:
      - RHEL System
      - rosa Instance
      - OpenShift Cluster
  target_host:
    description: Information about the target host for this usage event.
    type: object
    properties:
      instance_id:
        description: >
          Primary identifier for the instance of the service, according to the event producer. This needs to be unique to instance that created the event.
        type: string
        examples:
          - 1e69ce3d-e9f7-484f-98a3-ccb3c268ade7
          - i-1eavan31z971235
      display_name:
        description: >
          Display name for the target host. This is a human-readable identifier for the host.
        type: string
        examples:
          - host.example.com
          - my-instance
    required:
      - instance_id
  timestamp:
    description: Time that the event happened or the snapshot was captured.
    type: string
    format: date-time
    examples:
      - 2024-08-29T12:00:00Z
  product_tag:
    description: >
      Product tag that identifies the subscription product this event is associated with.
      This should match the 'tag' value of the product in swatch-product-configuration project subscription_configs.
    type: string
    examples:
      - rhel-for-x86
      - rosa
      - openshift-cluster
  measurement:
    description: Captures a measurement for the service instance. These values are used for tallying an instance's usage.
    type: object
    properties:
      value:
        description: Measurement value.
        type: number
      metric_id:
        description: >
          Metric ID for the measurement. This should equal the product's 'metrics->id' values in swatch-product-configuration project subscription_configs.
          Ex: A rosa instance can contain measurements for 'Cores' or 'Instance-hours' based on rosa.yaml in swatch-product-configuration.
        type: string
        examples:
          - Cores
          - Sockets
          - vCPUs
          - Instance-hours
          - Managed-nodes
          - Transfer-gibibytes
          - Storage-gibibyte-months
    required:
      - value
      - metric_id
required:
  - org_id
  - service_type
  - target_host
  - timestamp
