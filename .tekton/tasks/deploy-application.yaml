---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-application
spec:
  params:
    - name: BONFIRE_IMAGE
      type: string
    - name: SNAPSHOT
      type: string
    - name: NS
      type: string
    - name: NS_REQUESTER
      type: string
    - name: APP_INTERFACE_SECRET
      type: string
    - name: APP_NAME
      type: string
    - name: BONFIRE_COMPONENT_NAME
      type: string
      default: ""
    - name: COMPONENT_NAME
      type: string
      default: ""
    - name: COMPONENTS
      type: string
    - name: COMPONENTS_W_RESOURCES
      type: string
    - name: EXTRA_DEPLOY_ARGS
      type: string
    - name: DEPLOY_FRONTENDS
      type: string
    - name: DEPLOY_TIMEOUT
      type: string
    - name: OPTIONAL_DEPS_METHOD
      type: string
    - name: EPHEMERAL_ENV_PROVIDER_SECRET
      type: string
    - name: GITHUB_TOKEN_SECRET
      type: string
  workspaces:
    - name: artifacts
  results:
    - name: BONFIRE_COMMAND_FILE
      description: Path to the full Bonfire command relative to the artifacts workspace
    - name: DEPLOY_SUCCEEDED
      description: Whether the deploy succeeded ("true" or "false")
  steps:
    - name: deploy
      image: "$(params.BONFIRE_IMAGE)"
      env:
        - name: APP_INTERFACE_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.APP_INTERFACE_SECRET)
              key: username
        - name: APP_INTERFACE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.APP_INTERFACE_SECRET)
              key: password
        - name: APP_INTERFACE_BASE_URL
          valueFrom:
            secretKeyRef:
              name: $(params.APP_INTERFACE_SECRET)
              key: baseurl
        - name: OC_LOGIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
              key: token
        - name: OC_LOGIN_SERVER
          valueFrom:
            secretKeyRef:
              name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
              key: url
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.GITHUB_TOKEN_SECRET)
              key: github_token
        - name: NS
          value: "$(params.NS)"
        - name: BONFIRE_NS_REQUESTER
          value: "$(params.NS_REQUESTER)"
        - name: APP_NAME
          value: $(params.APP_NAME)
        - name: BONFIRE_COMPONENT_NAME
          value: $(params.BONFIRE_COMPONENT_NAME)
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
        - name: COMPONENTS
          value: $(params.COMPONENTS)
        - name: COMPONENTS_W_RESOURCES
          value: $(params.COMPONENTS_W_RESOURCES)
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: BONFIRE_BOT
          value: "true"
        - name: EXTRA_DEPLOY_ARGS
          value: "$(params.EXTRA_DEPLOY_ARGS)"
        - name: DEPLOY_FRONTENDS
          value: "$(params.DEPLOY_FRONTENDS)"
        - name: DEPLOY_TIMEOUT
          value: "$(params.DEPLOY_TIMEOUT)"
        - name: OPTIONAL_DEPS_METHOD
          value: "$(params.OPTIONAL_DEPS_METHOD)"
      script: |
        #!/bin/bash
        set +e

        if [ -n "${GITHUB_TOKEN:-}" ]; then
          export GITHUB_TOKEN="$(echo -n "$GITHUB_TOKEN" | tr -d '[:space:]')"
        fi

        DEPLOY_LOG="$(workspaces.artifacts.path)/deploy.log"
        EXIT_CODE_FILE="$(workspaces.artifacts.path)/deploy-exit-code"

        BONFIRE_COMMAND_FILE="$(workspaces.artifacts.path)/bonfire-command.txt"
        printf '%s' "" > "$BONFIRE_COMMAND_FILE"
        printf '%s' 'bonfire-command.txt' > "$(results.BONFIRE_COMMAND_FILE.path)"
        (
          set -euo pipefail
          set -f
          echo "Connecting to the ephemeral namespace cluster"
          login.sh

          # Component tests deploy only the image under test; IQE uses the full snapshot.
          if [[ -n "$COMPONENT_NAME" ]]; then
            SNAPSHOT=$(printf '%s' "$SNAPSHOT" | jq --arg name "$COMPONENT_NAME" \
              '{application: .application, components: [.components[] | select(.name == $name)]}')
            export SNAPSHOT
          fi
          snapshot_args=$(parse-snapshot.py)
          # Preserve deploy.sh's whitespace-separated argument contract without glob expansion.
          # shellcheck disable=SC2206
          extra_args=($EXTRA_DEPLOY_ARGS $snapshot_args)
          command=(bonfire deploy
            --source=appsre
            --ref-env "${REF_ENV:-insights-production}"
            --namespace "$NS"
            --timeout "${DEPLOY_TIMEOUT:-900}"
            --optional-deps-method "${OPTIONAL_DEPS_METHOD:-hybrid}"
            --frontends "${DEPLOY_FRONTENDS:-false}"
          )
          for component in $COMPONENTS; do
            command+=(--component "$component")
          done
          for component in $COMPONENTS_W_RESOURCES; do
            command+=(--no-remove-resources "$component")
          done
          command+=("${extra_args[@]}" "$APP_NAME")
          printf -v bonfire_command '%q ' "${command[@]}"
          printf '%s' "${bonfire_command% }" > "$BONFIRE_COMMAND_FILE"
          printf 'Executing: %s\n' "${bonfire_command% }"
          "${command[@]}"
        ) 2>&1 | tee "$DEPLOY_LOG"

        EXIT_CODE=${PIPESTATUS[0]}
        echo "$EXIT_CODE" > "$EXIT_CODE_FILE"
        echo "Deploy exit code: $EXIT_CODE"
        if [ "$EXIT_CODE" -eq 0 ]; then
          printf "true" > $(results.DEPLOY_SUCCEEDED.path)
        else
          printf "false" > $(results.DEPLOY_SUCCEEDED.path)
        fi
        exit 0
