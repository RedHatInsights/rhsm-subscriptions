---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-iqe-cji
spec:
  description: >-
    Deploy IQE CJI using the SWATCH deploy script (quoted --env-var for Ibutsu metadata).
  params:
    - name: BONFIRE_IMAGE
      type: string
    - name: EPHEMERAL_ENV_PROVIDER_SECRET
      type: string
      default: ephemeral-env-provider
    - name: NS
      type: string
    - name: NS_REQUESTER
      type: string
    - name: PROJECT_REPO
      type: string
      description: GitHub repo (org/name) containing .tekton/scripts/deploy-iqe-cji.sh
    - name: PROJECT_TASKS_REVISION
      type: string
      description: Git revision for the deploy script
    - name: COMPONENT_NAME
      type: string
    - name: BONFIRE_COMPONENT_NAME
      type: string
      default: ""
    - name: IQE_PLUGINS
      type: string
    - name: IQE_MARKER_EXPRESSION
      type: string
      default: ""
    - name: IQE_FILTER_EXPRESSION
      type: string
      default: ""
    - name: IQE_REQUIREMENTS
      type: string
      default: ""
    - name: IQE_REQUIREMENTS_PRIORITY
      type: string
      default: ""
    - name: IQE_TEST_IMPORTANCE
      type: string
      default: ""
    - name: IQE_CJI_TIMEOUT
      type: string
      default: 30m
    - name: IQE_ENV
      type: string
      default: clowder_smoke
    - name: IQE_ENV_VARS
      type: string
      default: ""
    - name: IQE_SELENIUM
      type: string
      default: "false"
    - name: IQE_PLAYWRIGHT
      type: string
      default: "false"
    - name: IQE_PARALLEL_ENABLED
      type: string
      default: "false"
    - name: IQE_PARALLEL_WORKER_COUNT
      type: string
      default: ""
    - name: IQE_RP_ARGS
      type: string
      default: ""
    - name: IBUTSU_SOURCE
      type: string
      default: ""
    - name: IQE_IMAGE_TAG
      type: string
      default: ""
  steps:
    - name: deploy-iqe-cji
      image: "$(params.BONFIRE_IMAGE)"
      env:
        - name: OC_LOGIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
              key: token
        - name: OC_LOGIN_SERVER
          valueFrom:
            secretKeyRef:
              name: $(params.EPHEMERAL_ENV_PROVIDER_SECRET)
              key: url
        - name: COMPONENT_NAME
          value: $(params.COMPONENT_NAME)
        - name: BONFIRE_COMPONENT_NAME
          value: $(params.BONFIRE_COMPONENT_NAME)
        - name: IQE_PLUGINS
          value: $(params.IQE_PLUGINS)
        - name: IQE_MARKER_EXPRESSION
          value: $(params.IQE_MARKER_EXPRESSION)
        - name: IQE_FILTER_EXPRESSION
          value: $(params.IQE_FILTER_EXPRESSION)
        - name: IQE_REQUIREMENTS
          value: $(params.IQE_REQUIREMENTS)
        - name: IQE_REQUIREMENTS_PRIORITY
          value: $(params.IQE_REQUIREMENTS_PRIORITY)
        - name: IQE_TEST_IMPORTANCE
          value: $(params.IQE_TEST_IMPORTANCE)
        - name: IQE_CJI_TIMEOUT
          value: $(params.IQE_CJI_TIMEOUT)
        - name: IQE_ENV
          value: $(params.IQE_ENV)
        - name: IQE_ENV_VARS
          value: $(params.IQE_ENV_VARS)
        - name: IQE_SELENIUM
          value: $(params.IQE_SELENIUM)
        - name: IQE_PLAYWRIGHT
          value: $(params.IQE_PLAYWRIGHT)
        - name: IQE_PARALLEL_ENABLED
          value: $(params.IQE_PARALLEL_ENABLED)
        - name: IQE_PARALLEL_WORKER_COUNT
          value: $(params.IQE_PARALLEL_WORKER_COUNT)
        - name: IQE_RP_ARGS
          value: $(params.IQE_RP_ARGS)
        - name: IBUTSU_SOURCE
          value: $(params.IBUTSU_SOURCE)
        - name: BONFIRE_BOT
          value: "true"
        - name: IQE_IMAGE_TAG
          value: $(params.IQE_IMAGE_TAG)
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Connecting to the ephemeral namespace cluster"
        login.sh

        deploy_script="/tmp/swatch-deploy-iqe-cji.sh"
        script_url="https://raw.githubusercontent.com/$(params.PROJECT_REPO)/$(params.PROJECT_TASKS_REVISION)/.tekton/scripts/deploy-iqe-cji.sh"
        echo "Fetching deploy script from ${script_url}"
        curl -fsSL "$script_url" -o "$deploy_script"
        chmod +x "$deploy_script"

        echo "Deploying the IQE CJI test"
        "$deploy_script" "$(params.NS)" "$(params.NS_REQUESTER)"
