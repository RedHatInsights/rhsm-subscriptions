# SWATCH Self PSK for internal service communication and for unit tests
%dev.SWATCH_SELF_PSK=placeholder
%test.SWATCH_SELF_PSK=${%dev.SWATCH_SELF_PSK}
# stage/prod values come from clowdapp.yaml for individual services

# Controls whether RbacRolesAugmentor is included at build time via @IfBuildProperty (requires rebuild to change)
swatch-common-security.include-rbac=true

SWATCH_TEST_APIS_ENABLED=true
%prod.SWATCH_TEST_APIS_ENABLED=false

RBAC_ENABLED=true
RBAC_ENDPOINT=${clowder.dependency-endpoints.rbac.service.uri}
%dev.RBAC_ENDPOINT=http://localhost:8006
%test.RBAC_ENDPOINT=http://localhost:8080
%component-tests.RBAC_ENDPOINT=http://wiremock-service:8000
RBAC_AUTHENTICATED=${clowder.dependency-endpoints.rbac.service.authenticated:false}
%dev.RBAC_AUTHENTICATED=false
%test.RBAC_AUTHENTICATED=false
%component-tests.RBAC_AUTHENTICATED=false
# Empty V2 truststore settings mean system trust, not the global V1 CA.
RBAC_TRUST_STORE=${clowder.dependency-endpoints.rbac.service.trust-store-path:}
RBAC_TRUST_STORE_PASSWORD=${clowder.dependency-endpoints.rbac.service.trust-store-password:}
RBAC_TRUST_STORE_TYPE=${clowder.dependency-endpoints.rbac.service.trust-store-type:PKCS12}

# Note the keystore and truststore values must be prefixed with either "classpath:" or "file:"
quarkus.rest-client."com.redhat.swatch.clients.rbac.api.resources.AccessApi".url=${RBAC_ENDPOINT}/api/rbac/v1
quarkus.rest-client."com.redhat.swatch.clients.rbac.api.resources.AccessApi".trust-store=${RBAC_TRUST_STORE}
quarkus.rest-client."com.redhat.swatch.clients.rbac.api.resources.AccessApi".trust-store-password=${RBAC_TRUST_STORE_PASSWORD}
quarkus.rest-client."com.redhat.swatch.clients.rbac.api.resources.AccessApi".trust-store-type=${RBAC_TRUST_STORE_TYPE}
quarkus.rest-client."com.redhat.swatch.clients.rbac.api.resources.AccessApi".providers=com.redhat.swatch.common.security.RbacAuthHeaderProvider

# Unleash toggle: when enabled, KesselRolesAugmentor handles auth and RbacRolesAugmentor is skipped
# Toggle name: swatch.common-security.use-kessel-rbac (default off — managed in Unleash)
quarkus.unleash.url=${UNLEASH_URL:http://localhost:4242/api}
quarkus.unleash.token=${UNLEASH_API_TOKEN:default:development.unleash-insecure-api-token}
quarkus.unleash.name-prefix=swatch
quarkus.unleash.devservices.enabled=${ENABLE_UNLEASH_DEV_SERVICES:false}
%test.quarkus.unleash.active=false

# Kessel / RBACv2 configuration
# Using .url instead of .hostname because clowder-quarkus-config-source does not support .hostname.
# KesselProperties.resolvedEndpoint() extracts the hostname from the URL and appends the gRPC port.
KESSEL_ENDPOINT=${clowder.endpoints.kessel-inventory-api.url:http://localhost:9000}
%dev.KESSEL_ENDPOINT=localhost:8006
%test.KESSEL_ENDPOINT=localhost:9000
%component-tests.KESSEL_ENDPOINT=wiremock-service:8000

swatch.kessel.endpoint=${KESSEL_ENDPOINT}
swatch.kessel.insecure=${KESSEL_INSECURE:true}
swatch.kessel.auth-enabled=${KESSEL_AUTH_ENABLED:false}
swatch.kessel.inventory-api-port=${KESSEL_INVENTORY_API_PORT:9000}
swatch.kessel.timeout-ms=${KESSEL_TIMEOUT_MS:5000}
swatch.kessel.rbac-base-endpoint=${RBAC_BASE_ENDPOINT:${RBAC_ENDPOINT}}
swatch.kessel.auth-oidc-issuer=${KESSEL_AUTH_OIDC_ISSUER:}
swatch.kessel.auth-client-id=${KESSEL_AUTH_CLIENT_ID:}
swatch.kessel.auth-client-secret=${KESSEL_AUTH_CLIENT_SECRET:}
