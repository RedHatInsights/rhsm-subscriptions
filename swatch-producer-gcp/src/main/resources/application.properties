quarkus.http.host=127.0.0.1
quarkus.http.port=8015
quarkus.http.test-port=0
quarkus.devservices.enabled=false

gcp.dry-run=true
gcp.endpoint=https://servicecontrol.googleapis.com
gcp.request-timeout=10s
# Live calls use the Google SDK with Application Default Credentials.
# GCP_EMULATOR_ENDPOINT optionally targets a loopback HTTP stub with no credentials.

# Stand-in for a GCP usage-context lookup from swatch-contracts. Exact matches only.
gcp.customers[0].org-id=example-org
gcp.customers[0].billing-account-id=example-billing-account
gcp.customers[0].product-id=example-product
gcp.customers[0].usage-reporting-id=project_number:123456789012

# Stand-in for product registry configuration. The real names come from Producer Portal.
gcp.meters[0].product-id=example-product
gcp.meters[0].metric-id=Instance-hours
gcp.meters[0].service-name=example-product.gcpmarketplace.example.com
gcp.meters[0].metric-name=example-product/instance_hours

mp.messaging.incoming.billable-usage-hourly-aggregate-in.connector=smallrye-in-memory
mp.messaging.outgoing.billable-usage-status-out.connector=smallrye-in-memory

# Opt into Kafka with QUARKUS_PROFILE=kafka. Google calls remain dry-run by default.
kafka.bootstrap.servers=localhost:9092
%kafka.mp.messaging.incoming.billable-usage-hourly-aggregate-in.connector=smallrye-kafka
%kafka.mp.messaging.incoming.billable-usage-hourly-aggregate-in.topic=platform.rhsm-subscriptions.billable-usage-hourly-aggregate
%kafka.mp.messaging.incoming.billable-usage-hourly-aggregate-in.group.id=swatch-producer-gcp-poc
%kafka.mp.messaging.incoming.billable-usage-hourly-aggregate-in.auto.offset.reset=latest
%kafka.mp.messaging.incoming.billable-usage-hourly-aggregate-in.value.deserializer=org.candlepin.subscriptions.billable.usage.BillableUsageAggregateDeserializer
%kafka.mp.messaging.outgoing.billable-usage-status-out.connector=smallrye-kafka
%kafka.mp.messaging.outgoing.billable-usage-status-out.topic=platform.rhsm-subscriptions.billable-usage.status
%kafka.mp.messaging.outgoing.billable-usage-status-out.value.serializer=org.candlepin.subscriptions.billable.usage.BillableUsageAggregateSerializer
